<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Console · StayonSite</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#000000" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/mark.png" />
    <link rel="preload" href="/fonts/instrument-sans.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      // Dark unless the visitor chose light; runs before paint to avoid a flash.
      try {
        if (localStorage.getItem("boardui:theme") === "light") document.documentElement.classList.remove("dark");
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/portal/main.tsx"></script>
  </body>
</html>
